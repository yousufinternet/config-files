# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
source = ~/.config/hypr/monitors.conf


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = konsole
$fileManager = konsole -e yazi
$menu = rofi -terminal $TERMINAL -show run -modi run,drun,ssh


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = wlsunset -l 30.51 -L 47.78 &
exec-once = hyprpaper
exec-once = dunst &
# exec-once = nm-applet &
exec-once = /usr/bin/hyprland-per-window-layout
exec-once = syncthing serve --no-browser &
exec-once = udiskie -T &
exec-once = emacs --daemon &
exec-once = hypridle


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
    snap {
	enabled = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = false # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = false # You probably want this
    default_split_ratio=1.3
    force_split = 1
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
     disable_hyprland_logo = true
     disable_splash_rendering = true
     enable_swallow = true
     swallow_regex=".*konsole.*"
}


binds {
      workspace_back_and_forth = true
      # allow_pin_fullscreen = true probably coming next version
}
#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ara
    kb_variant = ,qwerty
    kb_model = ,pc104
    kb_options = grp:alt_shift_toggle,altwin:menu_win
    kb_rules =

    follow_mouse = 1

    repeat_rate = 35
    repeat_delay = 300
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
}

group {
auto_group = true
   groupbar {
   	    render_titles = false
	    height = 3
	    col.active=0xffb79000
}
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod+Control, Return, exec, $terminal -e ipython
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod + Shift, E, exec, rofi -show powermenu -modi powermenu:~/Scripts/RofiMenus/wayland_powermenu.py -theme Lavendar_icons
bind = $mainMod + Control, C, exec, ~/Scripts/RofiMenus/calc_copy.sh
bind = $mainMod, F1, exec, ~/Scripts/RofiMenus/browse_man_pages.py
bind = $mainMod, p, exec, rofi-pass
bind = $mainMod + Control, F, exec, $fileManager
bind = $mainMod + Control, W, exec, qutebrowser
bind = $mainMod + Control, E, exec, emacsclient -n -c -a ""
bind = $mainMod + Shift, B, exec, toggle_brightness.py
bind = $mainMod + Shift, F, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, S, pin, 
bind = $mainMod, E, exec, $menu
bind = $mainMod+Control+Shift, E, exec, rofi -show emoji -modi emoji
# bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, R, togglesplit, # dwindle
bind = $mainMod+Shift, R, swapsplit, # dwindle
bind = $mainMod, G, togglegroup,
bind = $mainMod+Shift, G, moveoutofgroup,
bind = $mainMod+Control, G, lockactivegroup, toggle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod+Control, H, changegroupactive, b
bind = $mainMod+Control, L, changegroupactive, f
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod+Shift, H, movewindoworgroup, l
bind = $mainMod+Shift, L, movewindoworgroup, r
bind = $mainMod+Shift, K, movewindoworgroup, u
bind = $mainMod+Shift, J, movewindoworgroup, d
bind = $mainMod+Shift, X, splitratio, 0.15
bind = $mainMod+Shift, Z, splitratio, -0.15
binde = $mainMod+Control+Shift, h, resizeactive, -10 0
binde = $mainMod+Control+Shift, l, resizeactive, 10 0
binde = $mainMod+Control+Shift, k, resizeactive, 0 -10
binde = $mainMod+Control+Shift, j, resizeactive, 0 10

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9, focusworkspaceoncurrentmonitor, 9
bind = $mainMod, 0, focusworkspaceoncurrentmonitor, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod Control, 1, movetoworkspacesilent, 1
bind = $mainMod Control, 2, movetoworkspacesilent, 2
bind = $mainMod Control, 3, movetoworkspacesilent, 3
bind = $mainMod Control, 4, movetoworkspacesilent, 4
bind = $mainMod Control, 5, movetoworkspacesilent, 5
bind = $mainMod Control, 6, movetoworkspacesilent, 6
bind = $mainMod Control, 7, movetoworkspacesilent, 7
bind = $mainMod Control, 8, movetoworkspacesilent, 8
bind = $mainMod Control, 9, movetoworkspacesilent, 9
bind = $mainMod Control, 0, movetoworkspacesilent, 10

bind = , Print, exec, grim - | wl-copy
bind = Shift, Print, exec, grim -g "$(slurp -d)" - | wl-copy

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, volume_ctl.sh +5
bindel = ,XF86AudioLowerVolume, exec, volume_ctl.sh -10
bindel = $mainMod, equal, exec, volume_ctl.sh +5
bindel = $mainMod, minus, exec, volume_ctl.sh -10
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightness_ctl.sh +10
bindel = ,XF86MonBrightnessDown, exec, brightness_ctl.sh -10
bindel = $mainMod+Shift,equal, exec, brightness_ctl.sh +10
bindel = $mainMod+Shift,minus, exec, brightness_ctl.sh -10

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*
# windowrulev2 = group set always, class:.*
windowrulev2 = workspace 1, class:qutebrowser
windowrulev2 = workspace 4, class:Zeal
windowrulev2 = workspace 9, class:discord

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]
windowrulev2 = stayfocused, title:^()$,class:^(steam)$
windowrulev2 = minsize 1 1, title:^()$,class:^(steam)$
